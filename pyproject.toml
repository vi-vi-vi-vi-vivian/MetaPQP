[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-pqp"
version = "0.1.0"
description = "Page-first portal experience audit MVP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi",
  "httpx",
  "jinja2",
  "openjiuwen",
  "playwright",
  "pillow",
  "pydantic>=2",
  "pydantic-settings",
  "pyyaml",
  "requests",
  "sqlalchemy>=2",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
]
mcp = [
  "mcp",
]

[project.scripts]
meta-pqp = "portal_audit.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portal_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100
