nodes:
  - id: officeace-awareness
    version: 1.0.0
    title: OfficeAce 感知页
    entry_url: https://www.huaweicloud.com/product/officeace.html
    url_patterns:
      - https://www.huaweicloud.com/product/officeace.html
    expected_primary_stage: awareness
    allowed_stages: [awareness, purchase]
    expected_surface: portal
    auth_required: false
    product: officeace

  - id: officeace-purchase
    version: 1.0.0
    title: OfficeAce 个人高级版购买页
    entry_url: https://console.huaweicloud.com/agentarts/?region=cn-southwest-2#/shopping?product_list=%5B%7B%22skuCode%22:%22officeace.personal.package.advanced%22%7D%5D&type=OfficeAce
    url_patterns:
      - https://console.huaweicloud.com/agentarts/*#/shopping?*type=OfficeAce*
    expected_primary_stage: purchase
    allowed_stages: [purchase, order]
    expected_surface: console
    auth_required: true
    product: officeace

  - id: officeace-purchase-standard
    version: 1.0.0
    title: OfficeAce 个人标准版购买页
    entry_url: https://console.huaweicloud.com/agentarts/?region=cn-southwest-2#/shopping?product_list=%5B%7B%22skuCode%22:%22officeace.personal.package.standard%22%7D%5D&type=OfficeAce
    url_patterns:
      # The console keeps the colon in the JSON fragment unescaped.  Match the
      # stable SKU value rather than a particular URL-encoding representation.
      - https://console.huaweicloud.com/agentarts/*#/shopping?*officeace.personal.package.standard*type=OfficeAce*
    expected_primary_stage: purchase
    allowed_stages: [purchase, order]
    expected_surface: console
    auth_required: true
    product: officeace

  - id: officeace-purchase-premium
    version: 1.0.0
    title: OfficeAce 个人旗舰版购买页
    entry_url: https://console.huaweicloud.com/agentarts/?region=cn-southwest-2#/shopping?product_list=%5B%7B%22skuCode%22:%22officeace.personal.package.premium%22%7D%5D&type=OfficeAce
    url_patterns:
      # See the standard-plan pattern above: URL encoding is not stable across
      # browser navigation and must not decide the destination PageMapNode.
      - https://console.huaweicloud.com/agentarts/*#/shopping?*officeace.personal.package.premium*type=OfficeAce*
    expected_primary_stage: purchase
    allowed_stages: [purchase, order]
    expected_surface: console
    auth_required: true
    product: officeace
