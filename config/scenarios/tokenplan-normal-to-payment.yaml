version: "1.0.0"
id: tokenplan-normal-to-payment
product_binding: token-plan
persona: authenticated-buyer
auth:
  mode: required
  account_id: default
execution_matrix:
  source: web
  by_page_surface:
    portal:
      devices: [desktop, mobile]
      locale_strategy: url
    console:
      devices: [desktop]
      locales: [zh-CN, en-US]
required_stages: [awareness, purchase, order, payment]
stop_after: payment
safety:
  payment_read_only: true
  payment_action_allowed: false
