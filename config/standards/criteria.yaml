  - id: metapqp-internal/broken-links
    source_id: metapqp-internal
    title: 页面可见链接不应确认失效
  - id: metapqp-internal/commitment-risk-timing
    source_id: metapqp-internal
    title: 订阅与退订风险应在决策前清楚披露
  - id: metapqp-internal/content-internal-consistency
    source_id: metapqp-internal
    title: 页面内部产品规则和承诺应保持一致
  - id: metapqp-internal/copy-quality
    source_id: metapqp-internal
    title: 页面文案不应包含明确错别字或语病
  - id: metapqp-internal/cta-clarity
    source_id: metapqp-internal
    title: CTA 应明确表达动作和结果
  - id: metapqp-internal/document-structure
    source_id: metapqp-internal
    title: 页面应具有描述主题的 Title
  - id: metapqp-internal/image-alt
    source_id: metapqp-internal
    title: 可点击图片控件（如 Logo）应具有可访问名称
  - id: metapqp-internal/mobile-horizontal-overflow
    source_id: metapqp-internal
    title: 移动端页面不应出现意外横向溢出
  - id: metapqp-internal/mobile-tap-target-size
    source_id: metapqp-internal
    title: 移动端关键控件应具备足够触控区域
  - id: metapqp-internal/page-load
    source_id: metapqp-internal
    title: 页面应正常加载
  - id: metapqp-internal/reference-outcome-visibility
    source_id: metapqp-internal
    title: 对比中可迁移的结果价值可视性
  - id: metapqp-internal/reference-zero-cost-access
    source_id: metapqp-internal
    title: 对比中可迁移的低门槛体验入口
  - id: metapqp-internal/reference-option-discernibility
    source_id: metapqp-internal
    title: 对比中可迁移的选项差异与选择引导
  - id: metapqp-internal/reference-decision-information-proximity
    source_id: metapqp-internal
    title: 对比中可迁移的关键决策信息邻近披露
  - id: metapqp-internal/reference-state-continuity
    source_id: metapqp-internal
    title: 对比中可迁移的选择状态连续性
  - id: metapqp-internal/reference-commitment-boundary
    source_id: metapqp-internal
    title: 对比中可迁移的承诺边界告知
  - id: metapqp-internal/pricing-transparency
    source_id: metapqp-internal
    title: 价格、周期和资源量应能被独立核对
  - id: metapqp-internal/product-value-clarity
    source_id: metapqp-internal
    title: 产品价值应清晰可理解
  - id: metapqp-internal/runtime-errors
    source_id: metapqp-internal
    title: 页面不应出现影响核心功能的运行错误
  - id: metapqp-internal/terminology-clarity
    source_id: metapqp-internal
    title: 专业术语和计费名词应清晰可理解
  - id: metapqp-internal/visible-content-occlusion
    source_id: metapqp-internal
    title: 关键可见内容和操作控件不应被其他界面元素意外遮挡
  - id: metapqp-internal/text-clipping-and-truncation
    source_id: metapqp-internal
    title: 关键文本不应因布局错误而被裁切或不可读
  - id: metapqp-internal/responsive-visual-integrity
    source_id: metapqp-internal
    title: 移动端响应式布局不应出现明显错位、重叠或破版
  - id: metapqp-internal/journey-transition-reachability
    source_id: metapqp-internal
    title: 已登记的安全跳转应能到达预期页面
  - id: metapqp-internal/entry-and-resume-continuity
    source_id: metapqp-internal
    title: 登录或跨站跳转后应能恢复到预期业务入口
  - id: metapqp-internal/transaction-context-continuity
    source_id: metapqp-internal
    title: 跳转前后的产品和交易上下文应保持连续
  - id: metapqp-internal/cross-stage-product-identity-consistency
    source_id: metapqp-internal
    title: 多个旅程页面对同一产品的身份和定位不应产生实质冲突
  - id: metapqp-internal/cross-stage-commercial-terms-consistency
    source_id: metapqp-internal
    title: 多个旅程页面的商业条件不应产生影响决策的实质冲突
  - id: metapqp-internal/cross-stage-offering-consistency
    source_id: metapqp-internal
    title: 多个旅程页面的可选内容、规格和权益应能够对应
  - id: metapqp-internal/cross-stage-action-expectation-continuity
    source_id: metapqp-internal
    title: 操作入口建立的预期应与后续页面内容保持连续
  - id: metapqp-internal/cross-stage-terminology-consistency
    source_id: metapqp-internal
    title: 多个旅程页面的术语和概念应保持可理解的连续性
  - id: metapqp-internal/cross-stage-selection-continuity
    source_id: metapqp-internal
    title: 默认项和用户选择状态应在旅程中保持连续
  - id: metapqp-internal/cross-stage-decision-guidance-continuity
    source_id: metapqp-internal
    title: 影响选择的推荐与比较线索应在连续决策页面中保持可识别
  - id: metapqp-internal/cross-stage-lifecycle-state-consistency
    source_id: metapqp-internal
    title: 同一产品或资源的生命周期状态应跨页面同步
  - id: metapqp-internal/cross-stage-commitment-policy-consistency
    source_id: metapqp-internal
    title: 持续承诺、变更和退出规则不应跨页面冲突
