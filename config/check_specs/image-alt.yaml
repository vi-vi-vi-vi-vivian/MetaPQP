id: image-alt
version: 1.3.0
title: 可点击图片控件（如 Logo）应具有可访问名称
description: 仅在图片独立承担点击操作且整个控件没有可访问名称时形成问题；已有文字、父控件名称或等价上下文时不报，普通图片用途不明确时只转人工确认。
tags: [content, accessibility, image]
applies_when: {}
required_evidence: [evidence_elements]
executor: {type: deterministic, capability_id: image-alt-checker, version: 1.2.0}
default_severity: p2
standard_refs:
  - criterion_id: metapqp-internal/image-alt
    relation: implements
  - criterion_id: wcag-2.2/1.1.1
    relation: partial_coverage
    notes: 自动检查可见 img 的 Alt、可访问名称和邻近等价文本；无法判断图片用途时不形成违规结论。
