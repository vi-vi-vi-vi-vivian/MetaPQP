id: reference-state-continuity
version: 1.1.0
title: 用户选择是否连续保留
description: 仅在同一次检查实际采集到至少两步操作、选择动作及后续页面回显证据时检查。参考流程必须能证明已选套餐、模型或配置在下一步被保留或回显，主体在同类流程中丢失或要求重选时才可判为缺口。单页静态对比不具备判定条件，应不适用或待确认，不得输出泛泛的连续性建议。
scope: comparison
tags: [comparison, continuity]
applies_when: {dimensions: [state_continuity], page_roles: [awareness, purchase]}
required_evidence: [visible_text, evidence_elements]
executor: {type: model_skill, capability_id: competitive-opportunity-discovery}
default_severity: p2
standard_refs: [{criterion_id: metapqp-internal/reference-state-continuity, relation: implements}]
