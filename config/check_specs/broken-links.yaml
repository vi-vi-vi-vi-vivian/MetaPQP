id: broken-links
version: 1.4.0
title: 页面可见链接不应确认失效
description: 对有限数量的可见 HTTP 链接执行安全状态检查；HEAD 失败后使用 GET 复核，明确的 4xx 页面不存在状态判为失效，5xx、超时、连接错误、鉴权和限流只标记为待验证。
tags: [baseline, navigation]
applies_when: {}
required_evidence: [interactive_elements]
executor: {type: deterministic, capability_id: broken-links-checker, version: 1.3.0}
default_severity: p1
standard_refs:
  - criterion_id: metapqp-internal/broken-links
    relation: implements
